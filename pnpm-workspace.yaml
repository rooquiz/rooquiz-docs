allowBuilds:
  # esbuild + workerd are wrangler's native deps, needed for local `pnpm preview`.
  esbuild: true
  sharp: true
  workerd: true
overrides:
  # style-to-js@1.x ships a CJS build whose default export isn't a function under
  # raw Node ESM interop (exports.default instead of module.exports = fn). That
  # crashes hast-util-to-estree's parseStyle on any `<span style>` — i.e. on every
  # syntax-highlighted code block — with "styleToJs is not a function". 2.x sets
  # module.exports = fn and keeps the same (value, { reactCompat }) signature
  # hast-util-to-estree calls. hast-util-to-estree@3.1.3 still asks for ^1.0.0.
  style-to-js: ^2.0.0
